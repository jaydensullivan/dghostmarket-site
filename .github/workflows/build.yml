# Пересборка сайта: страницы на трёх языках и цены из живых лотов
# (tools/build.py). Раз в сутки (лоты меняются) и после правок шаблона,
# переводов или сборщика. Готовые страницы коммитятся в main — GitHub
# Pages публикует их как обычно. Если ничего не изменилось, коммита нет.
name: "Сайт: сборка страниц"

on:
  schedule:
    - cron: "41 1 * * *"   # 06:41 по Ташкенту
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "i18n.json"
      - "tools/**"

concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Сборка
        run: python3 tools/build.py
      - name: Коммит изменений
        run: |
          git config user.name "DGhost site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html uz en skins sitemap.xml robots.txt data
          git diff --cached --quiet && { echo "Без изменений."; exit 0; }
          git commit -q -m "Сайт: обновление страниц и цен"
          git push -q || { git pull -q --rebase && git push -q; }
