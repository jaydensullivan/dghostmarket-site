# Пересборка сайта: страницы на трёх языках, цены из живых лотов
# и рыночные цены ~400 популярных скинов в сумах (tools/build.py, tools/skins.py). Раз в сутки (лоты меняются) и после правок шаблона,
# переводов или сборщика. Готовые страницы коммитятся в main — GitHub
# Pages публикует их как обычно. Если ничего не изменилось, коммита нет.
name: "Сайт: сборка страниц"

on:
  schedule:
    - cron: "41 1 * * *"   # 06:41 по Ташкенту
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "i18n.json"
      - "tools/**"

concurrency:
  group: site-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Данные для страниц цен. Любой шаг может не скачаться — тогда страницы
      # цен остаются вчерашними, а остальной сайт собирается как обычно.
      - name: Справочник скинов (ByMykel/CSGO-API)
        run: |
          curl -fsSL --retry 3 -o data/skins-meta.json \
            https://raw.githubusercontent.com/ByMykel/CSGO-API/main/public/api/en/skins.json \
            || { echo "::warning::справочник скинов не скачался"; rm -f data/skins-meta.json; }
      - name: Цены Skinport
        run: |
          curl -fsSL --retry 3 --compressed -H "Accept-Encoding: br" -o data/skinport.json \
            "https://api.skinport.com/v1/items?app_id=730&currency=USD&tradable=0" \
            || { echo "::warning::цены Skinport не скачались"; rm -f data/skinport.json; }
      - name: Курс доллара ЦБ Узбекистана
        run: |
          curl -fsSL --retry 3 -o /tmp/cbu.json https://cbu.uz/uz/arkhiv-kursov-valyut/json/USD/ || true
          python3 - <<'PY'
          import json
          try:
              rate = float(json.load(open('/tmp/cbu.json'))[0]['Rate'])
              assert 5000 < rate < 50000
              json.dump({'usd_uzs': rate}, open('data/rate.json', 'w'))
              print('курс', rate)
          except Exception as e:
              print('::warning::курс ЦБ не получен, остаётся прошлый:', repr(e))
          PY
      # Какие скины есть в 3D — для кнопки «Покрутить в 3D» на страницах цен.
      # 3D-сервер отдаёт файлы только нашим сайтам (по заголовку Origin).
      # Не скачалось — остаётся прошлый data/models-3d.json.
      - name: Список 3D-моделей
        run: |
          for f in index extra; do
            curl -fsSL --retry 3 -H "Origin: https://dghostmarket.uz" -o /tmp/m-$f.json \
              https://3d.dghostmarket.com/models/$f.json || rm -f /tmp/m-$f.json
          done
          python3 - <<'PY'
          import json
          try:
              index = json.load(open('/tmp/m-index.json'))
              assert isinstance(index, dict) and len(index) > 100
          except Exception as e:
              print('::warning::список 3D-моделей не получен, остаётся прошлый:', repr(e))
              raise SystemExit(0)
          try:
              extra = json.load(open('/tmp/m-extra.json'))
          except Exception:
              extra = {}
          names = {n for n, v in {**extra, **index}.items() if isinstance(v, dict) and v.get('model')}
          json.dump(sorted(names), open('data/models-3d.json', 'w'), ensure_ascii=False, indent=0)
          print('3D-моделей:', len(names))
          PY
      - name: Сборка
        run: python3 tools/build.py
      - name: Коммит изменений
        run: |
          git config user.name "DGhost site bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A index.html uz en skins prices guides 3d-api sitemap.xml robots.txt data
          git diff --cached --quiet && { echo "Без изменений."; exit 0; }
          git commit -q -m "Сайт: обновление страниц и цен"
          git push -q || { git pull -q --rebase && git push -q; }
