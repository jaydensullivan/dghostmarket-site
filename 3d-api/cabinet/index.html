:root{
--bg:#08070D;
--surface:#130E1C;
--surface-2:#1B1428;
--line:rgba(168,85,247,0.22);
--accent:#7B2CFF;
--accent-2:#FF2BD6;
--violet:#A855F7;
--text:#F2F0F5;
--muted:#A8A4B3;
--grad:linear-gradient(135deg,#7B2CFF,#FF2BD6);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
margin:0;background:var(--bg);color:var(--text);
font:16px/1.6 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
overflow-x:hidden;
}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
/* шапка */
header{
position:sticky;top:0;z-index:10;
background:rgba(8,7,13,0.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.06);
}
.bar{display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:Orbitron,Inter,sans-serif;font-weight:900;letter-spacing:.02em;font-size:18px}
.brand img{height:46px;width:auto;filter:drop-shadow(0 0 12px rgba(123,44,255,.5))}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
nav.links{display:flex;gap:22px;margin-left:auto}
nav.links a{text-decoration:none;color:var(--muted);font-size:14px;font-weight:500}
nav.links a:hover{color:var(--text)}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langs a{background:none;border:0;color:var(--muted);font:600 12px Inter,sans-serif;padding:6px 10px;cursor:pointer;text-decoration:none}
.langs a.on{background:var(--accent);color:#fff}
.btn{
display:inline-flex;align-items:center;justify-content:center;gap:8px;
padding:12px 22px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;
border:1px solid transparent;cursor:pointer;white-space:nowrap;
}
.btn.primary{background:var(--grad);color:#fff;box-shadow:0 8px 30px rgba(123,44,255,0.35)}
.btn.ghost{border-color:var(--line);color:var(--text);background:rgba(255,255,255,0.02)}
.btn.small{padding:8px 14px;font-size:14px;border-radius:10px}
/* первый экран */
.hero{position:relative;padding-top:72px;padding-bottom:56px}
.hero::before{
content:"";position:absolute;top:-120px;left:50%;width:100vw;transform:translateX(-50%);height:620px;z-index:-1;pointer-events:none;
background:radial-gradient(600px 320px at 75% 40%,rgba(123,44,255,0.28),transparent 70%),
radial-gradient(420px 260px at 20% 20%,rgba(255,43,214,0.14),transparent 70%);
}
.hero-grid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.kicker{display:inline-block;font-size:13px;font-weight:600;color:var(--violet);border:1px solid var(--line);border-radius:999px;padding:5px 12px;margin-bottom:18px}
h1{font-size:clamp(32px,5vw,52px);line-height:1.1;margin:0 0 18px;letter-spacing:-0.02em}
h1 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{color:var(--muted);font-size:18px;max-width:560px;margin:0 0 28px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.fact b{display:block;font-size:18px}
.fact span{font-size:13px;color:var(--muted)}
.hero-art{display:flex;justify-content:center;order:2}
/* Первый экран — панель со свечением сверху, поиск скина прямо в ней. */
.hero-panel{position:relative;padding:44px 44px 36px;border-radius:28px;border:1px solid var(--line);
background:linear-gradient(180deg,rgba(23,16,34,0.92),rgba(10,8,15,0.96));
box-shadow:0 -18px 80px -20px rgba(123,44,255,0.55),0 0 0 1px rgba(255,255,255,0.02) inset}
.hero-panel::before{content:"";position:absolute;left:8%;right:8%;top:-1px;height:2px;border-radius:2px;
background:linear-gradient(90deg,transparent,#7b6cff,#b34dff,#ff2bd6,transparent)}
.hsearch{display:flex;gap:8px;margin:6px 0 10px;padding:6px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,0.03);max-width:560px}
.hsearch input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:500 16px Inter,sans-serif;padding:0 10px}
.hsearch input::placeholder{color:var(--muted)}
.hsearch:focus-within{border-color:rgba(179,77,255,0.6);box-shadow:0 0 0 3px rgba(179,77,255,0.15)}
.hsearch .btn{padding:10px 18px}
.hchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 18px}
.hchips a{font-size:13px;color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:999px;padding:4px 11px}
.hchips a:hover{color:var(--text);border-color:rgba(179,77,255,0.6)}
/* Первый экран: 4 реальных лота под кнопками и строка доверия. */
.hlots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:22px 0 4px}
.hlot{display:flex;flex-direction:column;gap:4px;padding:8px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,0.03);color:var(--text);text-decoration:none;min-width:0}
.hlot img{width:100%;aspect-ratio:4/3;object-fit:contain;border-radius:10px;background:radial-gradient(ellipse at 50% 40%,#2a2238,#130e1c 70%)}
.hlot b{font-size:13px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
.hlot span{font-size:14px;font-weight:700;white-space:nowrap}
.trust{list-style:none;display:flex;flex-wrap:wrap;gap:6px 16px;padding:0;margin:14px 0 0;color:var(--muted);font-size:13px}
.hero-art img{width:100%;max-width:440px;height:auto;filter:drop-shadow(0 20px 60px rgba(123,44,255,0.45))}
/* Витрина: нож в 3D поворачивается прокруткой. Без JS, WebGL или при
   «уменьшить движение» — обычный блок из трёх карточек. */
.show3d{padding:24px 0 40px}
.show3d .s3-stage{position:relative}
.show3d .s3-frame{display:none}
.show3d h2{text-align:center;margin:0 auto 22px;max-width:720px}
.show3d h2 span{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.s3-caps{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.s3-cap{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px}
.s3-cap b{display:block;font-size:17px;margin-bottom:4px}
.s3-cap span{color:var(--muted);font-size:15px}
.show3d.live{height:260vh;padding:0}
.show3d.live .s3-stage{position:sticky;top:64px;height:calc(100vh - 64px);overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:24px 0}
.show3d.live .s3-stage::before{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
background:radial-gradient(520px 360px at 50% 50%,rgba(123,44,255,0.30),transparent 70%),radial-gradient(360px 240px at 70% 70%,rgba(255,43,214,0.14),transparent 70%)}
.show3d.live .s3-frame{display:block;position:absolute;inset:0;width:100%;height:100%;border:0;pointer-events:none;opacity:0;transition:opacity .8s ease;background:transparent;color-scheme:normal}
.show3d.live .s3-frame.on{opacity:1}
.show3d.live h2{position:relative;transition:opacity .4s,transform .4s}
.show3d.live .s3-caps{position:relative;display:block;height:120px}
.show3d.live .s3-cap{position:absolute;left:50%;bottom:0;width:min(520px,calc(100% - 40px));transform:translate(-50%,16px);opacity:0;transition:opacity .45s,transform .45s;
background:rgba(19,14,28,0.78);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);text-align:center}
.show3d.live .s3-cap.on{opacity:1;transform:translate(-50%,0)}
.show3d.live .s3-bar{position:absolute;left:50%;bottom:10px;width:120px;height:3px;transform:translateX(-50%);border-radius:3px;background:rgba(255,255,255,0.08);overflow:hidden}
.show3d.live .s3-bar i{display:block;height:100%;width:0;background:var(--grad)}
.s3-bar{display:none}
@media (max-width:900px){
.s3-caps{grid-template-columns:1fr}
.show3d.live .s3-stage{top:64px}
.show3d.live .s3-caps{height:140px}
}
/* секции */
section{padding:64px 0}
.sec-head{max-width:640px;margin-bottom:32px}
h2{font-size:clamp(26px,3.4vw,36px);margin:0 0 10px;letter-spacing:-0.01em}
.sec-head p{color:var(--muted);margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:26px}
.panel h3{margin:0 0 16px;font-size:19px;display:flex;align-items:center;gap:10px}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps li{position:relative;padding:0 0 18px 48px;counter-increment:s}
.steps li:last-child{padding-bottom:0}
.steps li::before{
content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:10px;
display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;
background:rgba(123,44,255,0.16);color:#cfa8ff;border:1px solid var(--line);
}
.steps b{display:block;margin-bottom:2px}
.steps span{color:var(--muted);font-size:15px}
/* комиссии */
.fees{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.fee{background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:24px}
.fee .who{font-size:13px;font-weight:600;color:var(--violet);text-transform:uppercase;letter-spacing:.06em}
.fee .num{font-size:40px;font-weight:800;margin:8px 0 6px;letter-spacing:-0.02em}
.fee p{margin:0;color:var(--muted);font-size:15px}
/* безопасность */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:22px}
.card .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(123,44,255,0.16);border:1px solid var(--line);margin-bottom:14px}
.card .ic svg{width:22px;height:22px;stroke:#cfa8ff}
.card h3{margin:0 0 6px;font-size:17px}
.card p{margin:0;color:var(--muted);font-size:15px}
.note{margin-top:20px;padding:16px 18px;border-radius:14px;border:1px solid var(--line);background:rgba(123,44,255,0.07);color:var(--text);font-size:15px}
/* вопросы */
details{background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:4px 20px;margin-bottom:10px}
summary{cursor:pointer;font-weight:600;padding:14px 0;list-style:none;display:flex;justify-content:space-between;gap:16px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--violet);font-size:20px;line-height:1}
details[open] summary::after{content:"−"}
details p{margin:0 0 16px;color:var(--muted)}
/* документы и контакты */
.docs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.doc{display:flex;flex-direction:column;gap:6px;text-decoration:none;background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:14px;padding:18px;transition:border-color .15s}
.doc:hover{border-color:var(--violet)}
.doc b{font-size:15px}
.doc span{color:var(--muted);font-size:13px}
.req{display:grid;grid-template-columns:auto 1fr;gap:8px 20px;margin:0}
.req dt{color:var(--muted);font-size:14px}
.req dd{margin:0;font-size:15px}
.cta-final{text-align:center;padding:56px 24px;border-radius:24px;background:radial-gradient(500px 220px at 50% 0%,rgba(123,44,255,0.35),transparent 70%),var(--surface);border:1px solid var(--line)}
.cta-final h2{margin-bottom:8px}
.cta-final p{color:var(--muted);margin:0 0 24px}
footer{border-top:1px solid rgba(255,255,255,0.06);padding:28px 0 40px;color:var(--muted);font-size:13px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
footer .wrap>div{flex:1 1 320px;min-width:0}
footer .wrap>div:last-child{text-align:right}
@media (max-width:720px){footer .wrap{flex-direction:column;align-items:center;text-align:center}footer .wrap>div:last-child{text-align:center}}
@media (max-width:900px){
nav.links{display:none}
.langs{margin-left:auto}
.hero{padding-top:40px;padding-bottom:24px}
.hero-grid{grid-template-columns:1fr}
.hero-grid{display:block}
.hero-art{float:right;width:112px;margin:0 0 8px 12px}
.hero-art img{max-width:112px}
.hero-panel{padding:22px 16px 20px;border-radius:20px}
.cta .btn{flex:1 1 0;padding:12px 10px}
.trust{clear:both}
.two,.fees,.cards{grid-template-columns:1fr}
.docs{grid-template-columns:1fr 1fr}
section{padding:44px 0}
}
@media (max-width:520px){
.wrap{padding:0 16px}
.hlots{grid-template-columns:repeat(2,minmax(0,1fr))}
.bar .btn.small{display:none}
.docs{grid-template-columns:1fr}
.cta .btn{flex:1}
/* Длинная подпись кнопки (узбекский) не вылезает за экран. */
.btn{max-width:100%;white-space:normal;text-align:center}
.req{grid-template-columns:1fr;gap:2px}
.req dd{margin-bottom:10px}
}
/* Зоны нажатия ≥44px: внешний вид прежний, расширяется только невидимая область. */
.langs{overflow:visible}
.langs a{position:relative}
.langs a:first-child{border-radius:999px 0 0 999px}
.langs a:last-child{border-radius:0 999px 999px 0}
.langs a::after{content:'';position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
footer a,.crumbs a{display:inline-block;padding:6px 0}

.pro-tiers{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}
.pro-tier{background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:20px;position:relative}
.pro-tier.pop{border-color:var(--violet)}
.pro-tier .tag{position:absolute;top:-11px;left:16px;background:var(--grad);color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.pro-tier h3{margin:0 0 6px;font-size:18px}
.pro-tier .p{font-size:24px;font-weight:800}
.pro-tier .per{color:var(--muted);font-size:13px;margin-bottom:12px}
.pro-tier ul{list-style:none;padding:0;margin:0;color:var(--muted);font-size:14px}
.pro-tier li{margin:5px 0}
.pro-first{margin-top:16px;font-weight:600}
@media(max-width:900px){.pro-tiers{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.pro-tiers{grid-template-columns:1fr}}

.lots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.lot{display:flex;flex-direction:column;min-width:0;background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:16px;text-decoration:none;color:inherit}
.lot img{width:100%;aspect-ratio:4/3;object-fit:contain;background:radial-gradient(ellipse at 50% 40%,#2a2238,#130e1c 70%);border-radius:12px;margin-bottom:12px}
.lot h3{margin:0 0 4px;font-size:16px;line-height:1.3}
.lot .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.lot .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.lot .price{font-weight:700;font-size:18px}
.lot .tag{font-size:12px;color:#7CF2A5}
.lot .go{background:var(--grad);color:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;white-space:nowrap}
.cat-group{margin:36px 0 14px;font-size:20px}
.crumbs{color:var(--muted);font-size:14px;margin:24px 0 8px}
.crumbs a{color:var(--muted)}
.more{margin-top:20px}
@media(max-width:900px){.lots{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.lots{grid-template-columns:minmax(0,1fr)}}

.r3d .wrap > .hero-badge:first-child{margin-top:32px}
.r3d .hero-badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--violet);margin:8px 0 18px}
.r3d .actions{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 8px}
.r3d h2{font-size:26px;margin:0 0 18px}
.r3d .block{padding:44px 0 0}
.r3d .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.r3d .card{background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:18px}
.r3d .card b{display:block;font-size:17px;margin-bottom:8px}
.r3d .card p{color:var(--muted);font-size:15px;line-height:1.55;margin:0}
.r3d ul.who{display:flex;flex-wrap:wrap;gap:10px;list-style:none;padding:0;margin:0}
.r3d ul.who li{background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:15px}
.r3d .sub{color:var(--muted);margin:-8px 0 20px;max-width:720px}
.r3d .plans{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.r3d .plan{position:relative;display:flex;flex-direction:column;background:var(--surface);border:1px solid rgba(255,255,255,0.06);border-radius:18px;padding:18px 16px}
.r3d .plan.best{border-color:var(--violet);box-shadow:0 8px 30px rgba(123,44,255,0.25)}
.r3d .plan .tag{position:absolute;top:-11px;left:16px;background:var(--grad);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600}
.r3d .plan h3{margin:0 0 8px;font-size:18px}
.r3d .plan .price{font-size:28px;font-weight:800}

<script>
// Языки — отдельные страницы (/, /uz/, /en/): их видят поисковики. Выбор
// языка запоминаем; на русской странице узбекоязычного гостя (по языку
// браузера) отправляем на /uz/.
document.querySelectorAll('[data-lang]').forEach(a => a.addEventListener('click', () => {
try { localStorage.setItem('dgm_lang', a.dataset.lang); } catch (e) {}
}));
(function(){
if (document.documentElement.lang !== 'ru') return;
let saved = null;
try { saved = localStorage.getItem('dgm_lang'); } catch (e) {}
if (!saved && (navigator.language || '').toLowerCase().startsWith('uz')) saved = 'uz';
if (saved === 'uz' || saved === 'en') location.replace('/' + saved + '/' + location.hash);
})();
</script>
<script>
// Витрина: нож Karambit | Lore из 3D-движка мини-аппа (embed.html?hero=1).
// Fade на ножах пока расходится с игрой (сверка со Steam 53–57), Lore — 90.7.
// поворачивается прокруткой. Не включаем при «уменьшить движение»,
// экономии трафика, без WebGL и на слабых устройствах — там остаётся
// обычный блок с карточками.
(function(){
var sec = document.getElementById('showcase');
if (!sec) return;
var nav = navigator, conn = nav.connection || {};
if ((window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) || conn.saveData
  || (nav.deviceMemory && nav.deviceMemory < 3) || (nav.hardwareConcurrency && nav.hardwareConcurrency < 4)) return;
try { var c = document.createElement('canvas'); if (!(c.getContext('webgl2') || c.getContext('webgl'))) return; } catch (e) { return; }
var APP = 'https://app.dghostmarket.uz';
var lang = document.documentElement.lang || 'ru';
var frame = sec.querySelector('.s3-frame');
var caps = sec.querySelectorAll('.s3-cap');
var bar = sec.querySelector('.s3-bar i');
var h2 = sec.querySelector('h2');
sec.classList.add('live');
var started = false;
function start(){
if (started) return;
started = true;
frame.src = APP + '/embed.html?key=demo&hero=1&skin=' + encodeURIComponent('★ Karambit | Lore') + '&float=0.03&seed=73&lang=' + lang;
}
// Грузим 3D, только когда витрина рядом с экраном.
if ('IntersectionObserver' in window){
new IntersectionObserver(function(es, o){ if (es[0].isIntersecting){ start(); o.disconnect(); } }, { rootMargin: '400px 0px' }).observe(sec);
} else start();
window.addEventListener('message', function(e){
if (e.origin !== APP || !e.data || e.data.source !== 'dghost3d') return;
if (e.data.event === 'ready'){ ready = true; last = -1; frame.classList.add('on'); update(); }
// 3D не открылось — возвращаем обычный блок.
if (e.data.event === 'error'){ sec.classList.remove('live'); frame.remove(); }
});
var last = -1, ready = false;
function update(){
if (!sec.classList.contains('live')){ h2.style.opacity = ''; return; }
var r = sec.getBoundingClientRect();
var span = sec.offsetHeight - (window.innerHeight - 64);
var p = Math.min(1, Math.max(0, (64 - r.top) / Math.max(1, span)));
if (Math.abs(p - last) > 0.001){
last = p;
if (ready && frame.contentWindow) frame.contentWindow.postMessage({ source: 'dghost-site', type: 'hero', p: p }, APP);
var idx = p < 0.08 ? -1 : Math.min(caps.length - 1, Math.floor((p - 0.08) / 0.92 * caps.length));
for (var i = 0; i < caps.length; i++) caps[i].classList.toggle('on', i === idx);
h2.style.opacity = idx < 0 ? 1 : 0.35;
if (bar) bar.style.width = (p * 100).toFixed(1) + '%';
}
}
window.addEventListener('scroll', update, { passive: true });
window.addEventListener('resize', update);
setInterval(update, 500);
update();
})();
</script>
</body>
</html>
