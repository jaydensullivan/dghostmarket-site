    <script>
      // Язык версии: переменная lang (ru | uz). Подписи и экраны обоих языков лежат в сценах,
      // CSS выше оставляет видимым только выбранный.
      (function () {
        var v = {};
        try { v = window.__hyperframes.getVariables() || {}; } catch (e) {}
        document.documentElement.dataset.lang = v.lang === "uz" ? "uz" : "ru";
      })();
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
